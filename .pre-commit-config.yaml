repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run ty check # or simply 'ty check' if in an activated venv
        language: system
        types: [python]
        pass_filenames: true

exclude: ^(dev/freesurfer)